schema_version: 1

repo:
  main_branch: main
  scopes: free
  tickets: none
  generated_artifacts: false
  task_runner: none

# The editor version matches sandbox/ProjectSettings/ProjectVersion.txt.
verify:
  - $HOME/Unity/Hub/Editor/6000.0.85f2/Editor/Unity -batchmode -nographics -quit -projectPath sandbox -executeMethod KayKitAssets.Verify -logFile /tmp/unity-sandbox-assets-verify.log
  - python3 -m pytest scripts -q
  - python3 scripts/check-meta.py

land: ff
deps: []
