name: Unity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      autoplay:
        description: "Also run the team autoplay (server + 3 clients, Normal then Kindled; headless under Xvfb)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unity Test Runner (EditMode + PlayMode)
    # Public fork code must not execute under the locally licensed host user.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, unity-licensed]
    timeout-minutes: 30
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
          # Reuse Unity's import cache in this persistent runner workspace.
          clean: false

      - name: Clean workspace except Unity import cache
        id: clean
        run: git clean -ffdx -e /sandbox/Library/

      - name: Test runner scripts
        run: python3 -m pytest scripts -q

      - name: Run Unity Tests
        run: bash scripts/run-unity-tests.sh

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.clean.outcome == 'success'
        with:
          name: Test results
          path: |
            artifacts/EditMode.*
            artifacts/PlayMode.*
            artifacts/warmup-*.log
          retention-days: 14

  autoplay:
    # cinderreach-team-autoplay: the session autoplay plays as a team on the licensed runner,
    # on demand only (no schedule since 2026-11-25: unattended runs popped windows on the
    # desktop). Dedicated server + three clients (fenwalker lead, lanternbearer, rogue) play
    # the whole campaign on Normal up to Thewes, whose kill unlocks Kindled; a second session
    # plays Kindled from the same saves. Results go to the artifact (14 days) and to
    # ~/unity-sandbox-autoplay/<YYYY-MM-DD>[-<run_id>]/{normal,kindled}/ on the host, which
    # dotfiles G-DIABLO06 reads.
    name: Session autoplay (team, dedicated server, Xvfb)
    if: github.event_name == 'workflow_dispatch' && inputs.autoplay
    runs-on: [self-hosted, Linux, X64, unity-licensed]
    timeout-minutes: 300
    env:
      # Xvfb off-screen, rendered on the RTX 3060 Ti through Mesa d3d12 (/dev/dxg): no
      # windows on the desktop. The 5070 Ti stays free for the LLM services. Three clients
      # share the GPU, so there is no fps gate.
      COOP_DISPLAY: xvfb-gpu
      AUTOPLAY_GPU_ADAPTER: "3060"
    concurrency:
      group: unity-autoplay
      cancel-in-progress: false
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
          # Keep the Unity import cache; G-DIABLO03 reads artifacts/*.xml of this workspace.
          clean: false

      - name: Build and run the team autoplay (Normal, then Kindled from the saves)
        id: run
        run: |
          OUT="artifacts/autoplay/$(date +%F)-${GITHUB_RUN_ID}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          bash scripts/run-team-autoplay.sh "$OUT"

      - name: Copy results to host store
        if: always() && steps.run.outputs.out != ''
        env:
          RUN_OUT: ${{ steps.run.outputs.out }}
        run: |
          # <date>[-<run_id>]/{normal,kindled}/{server,client1..3}/ plus team-verdict.json per session.
          BASE="$HOME/unity-sandbox-autoplay/$(date +%F)"
          if [ -e "$BASE" ]; then BASE="$BASE-${GITHUB_RUN_ID}"; fi
          for kind in normal kindled; do
            [ -d "$RUN_OUT/$kind" ] || continue
            mkdir -p "$BASE/$kind"
            cp -a "$RUN_OUT/$kind/." "$BASE/$kind/" || true
          done
          ls -laR "$BASE" | head -60
          find "$HOME/unity-sandbox-autoplay" -mindepth 1 -maxdepth 1 -type d -mtime +30 -print -exec rm -rf {} +

      - name: Upload autoplay artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoplay-${{ github.run_id }}
          path: artifacts/autoplay
          retention-days: 14
