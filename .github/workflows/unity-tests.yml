name: Unity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      autoplay:
        description: "Also run the session autoplay (Normal, Kindled, Lanternbearer; headless under Xvfb)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unity Test Runner (EditMode + PlayMode)
    # Public fork code must not execute under the locally licensed host user.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, unity-licensed]
    timeout-minutes: 30
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
          # Reuse Unity's import cache in this persistent runner workspace.
          clean: false

      - name: Clean workspace except Unity import cache
        id: clean
        run: git clean -ffdx -e /sandbox/Library/

      - name: Test runner scripts
        run: python3 -m pytest scripts -q

      - name: Run Unity Tests
        run: bash scripts/run-unity-tests.sh

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.clean.outcome == 'success'
        with:
          name: Test results
          path: |
            artifacts/EditMode.*
            artifacts/PlayMode.*
            artifacts/warmup-*.log
          retention-days: 14

  autoplay:
    # cinderreach-loop-guard: full-session autoplay on the licensed runner, on demand only
    # (no schedule since 2026-11-25: unattended runs popped 3 windows on the desktop and
    # were killed when they got closed). Result JSON goes to the artifact (14 days) and to
    # ~/unity-sandbox-autoplay/<YYYY-MM-DD>/ on the host, which dotfiles G-DIABLO06 reads.
    name: Session autoplay (Linux player, Xvfb)
    if: github.event_name == 'workflow_dispatch' && inputs.autoplay
    runs-on: [self-hosted, Linux, X64, unity-licensed]
    timeout-minutes: 60
    env:
      # Xvfb + llvmpipe instead of the WSLg GPU: no windows on the desktop, and the WSLg
      # d3d12 path crashes at startup (SIGSEGV in libnvidia-gpucomp) since the 2026-11-25
      # driver update. A full route takes ~4 min at ~8 fps; the Linux fps-gate is advisory.
      AUTOPLAY_DISPLAY: xvfb
    concurrency:
      group: unity-autoplay
      cancel-in-progress: false
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
          # Keep the Unity import cache; G-DIABLO03 reads artifacts/*.xml of this workspace.
          clean: false

      - name: Build and run autoplay (Normal + Kindled + Lanternbearer)
        id: run
        run: |
          OUT="artifacts/autoplay/$(date +%F)-${GITHUB_RUN_ID}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          # replayability S3: rotate the Ashen Fen layout seed 0..2 by weekday.
          SEED=$(( $(date +%u) % 3 ))
          echo "layout seed $SEED"
          AUTOPLAY_BUILD_ONLY=1 bash scripts/run-autoplay.sh "$OUT/build"
          run_route() {
            local route=$1
            shift
            local profile
            profile=$(mktemp -d "$RUNNER_TEMP/autoplay.XXXXXXXX")
            HOME="$profile" XDG_CONFIG_HOME="$profile/config" XDG_DATA_HOME="$profile/data" XDG_CACHE_HOME="$profile/cache" \
              AUTOPLAY_SKIP_BUILD=1 bash scripts/run-autoplay.sh "$OUT/$route" -seed "$SEED" "$@"
          }
          run_route normal -port 28771 &
          normal=$!
          run_route kindled -port 28772 -difficulty kindled &
          kindled=$!
          run_route lanternbearer -port 28773 -class lanternbearer &
          lanternbearer=$!
          rc=0
          for pid in "$normal" "$kindled" "$lanternbearer"; do
            wait "$pid" || rc=1
          done
          exit "$rc"

      - name: Copy results to host store
        if: always() && steps.run.outputs.out != ''
        env:
          RUN_OUT: ${{ steps.run.outputs.out }}
        run: |
          # One folder per run kind: <date>[-<run_id>], ...-kindled, ...-lanternbearer.
          BASE="$HOME/unity-sandbox-autoplay/$(date +%F)"
          if [ -f "$BASE/autoplay-result.json" ]; then BASE="$BASE-${GITHUB_RUN_ID}"; fi
          for kind in normal kindled lanternbearer; do
            [ -d "$RUN_OUT/$kind" ] || continue
            DEST="$BASE"
            [ "$kind" != normal ] && DEST="$BASE-$kind"
            mkdir -p "$DEST"
            cp -a "$RUN_OUT/$kind/." "$DEST/" || true
            ls -la "$DEST"
          done
          find "$HOME/unity-sandbox-autoplay" -mindepth 1 -maxdepth 1 -type d -mtime +30 -print -exec rm -rf {} +

      - name: Upload autoplay artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autoplay-${{ github.run_id }}
          path: artifacts/autoplay
          retention-days: 14
