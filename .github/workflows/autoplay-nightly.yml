name: Autoplay Nightly

# cinderreach-loop-guard S2: nightly full-session autoplay on the licensed
# self-hosted runner. Result JSON is kept as artifact (14 days) and copied to
# ~/unity-sandbox-autoplay/<YYYY-MM-DD>/ on the host, which the dotfiles
# health probe G-DIABLO06 reads (30-day local retention).

on:
  schedule:
    # 03:30 Europe/Berlin in winter (CET = UTC+1).
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-autoplay
  cancel-in-progress: false

jobs:
  autoplay:
    name: Session autoplay (Linux player, WSLg GPU)
    runs-on: [self-hosted, Linux, X64, unity-licensed]
    timeout-minutes: 45
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          # Keep untracked files: the runner workspace is shared with Unity Tests,
          # and dotfiles G-DIABLO03 reads its artifacts/*.xml. A clean checkout
          # here wiped them, so G-DIABLO03 fell back to stale results.
          clean: false

      - name: Build and run autoplay (Normal + Kindled)
        id: run
        run: |
          OUT="artifacts/autoplay/$(date +%F)-${GITHUB_RUN_ID}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          # replayability S3: rotate the Ashen Fen layout seed 0..2 by weekday.
          SEED=$(( $(date +%u) % 3 ))
          echo "layout seed $SEED"
          set +e
          bash scripts/run-autoplay.sh "$OUT/normal" -seed "$SEED"
          RC_NORMAL=$?
          # replayability S5: second run on Kindled, same build and seed.
          AUTOPLAY_SKIP_BUILD=1 bash scripts/run-autoplay.sh "$OUT/kindled" -seed "$SEED" -difficulty kindled
          RC_KINDLED=$?
          set -e
          echo "normal exit $RC_NORMAL, kindled exit $RC_KINDLED"
          [ "$RC_NORMAL" -eq 0 ] && [ "$RC_KINDLED" -eq 0 ]

      - name: Copy results to host store
        if: always() && steps.run.outputs.out != ''
        env:
          RUN_OUT: ${{ steps.run.outputs.out }}
        run: |
          # One folder per run and difficulty: <date>[-<run_id>] and <date>[-<run_id>]-kindled.
          BASE="$HOME/unity-sandbox-autoplay/$(date +%F)"
          if [ -f "$BASE/autoplay-result.json" ]; then BASE="$BASE-${GITHUB_RUN_ID}"; fi
          for kind in normal kindled; do
            [ -d "$RUN_OUT/$kind" ] || continue
            DEST="$BASE"
            [ "$kind" = kindled ] && DEST="$BASE-kindled"
            mkdir -p "$DEST"
            cp -a "$RUN_OUT/$kind/." "$DEST/" || true
            ls -la "$DEST"
          done
          find "$HOME/unity-sandbox-autoplay" -mindepth 1 -maxdepth 1 -type d -mtime +30 -print -exec rm -rf {} +

      - name: Upload autoplay artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoplay-${{ github.run_id }}
          path: artifacts/autoplay
          retention-days: 14
